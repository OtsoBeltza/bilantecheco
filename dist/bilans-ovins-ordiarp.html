:root{--vert:#1F3D2B;--vert2:#2F5A40;--ocre:#C58B2A;--creme:#F7F3EA;--sable:#EFE6CF;--txt:#222;--gris:#6b6b60;--bord:#DDD6C4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--txt);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,h4{font-family:'Source Serif 4',Georgia,serif;color:var(--vert);margin:0}
h2{font-size:24px;margin:6px 0 4px} h3{font-size:18px;margin:0 0 10px} h4{font-size:15px;margin:0 0 4px}
.haut{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--vert);color:#fff}
.haut.accueil{display:block;padding:26px 18px 22px;position:static}
.haut .sur{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#E2C98F}
.haut h1{color:#fff;font-size:28px}
.haut .titre{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.haut .titre b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#etat{font-size:11.5px;color:#cfd9d2}#etat.ko{color:#ffd9a0}
.retour{background:none;border:0;color:#fff;font-size:30px;line-height:1;padding:0 8px;cursor:pointer}
.modnav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--bord);position:sticky;top:53px;z-index:15;scrollbar-width:thin}
.chipnav{flex:none;border:1px solid var(--bord);background:var(--creme);border-radius:999px;padding:7px 13px;font:600 13.5px Inter;color:var(--vert);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chipnav.actif{background:var(--vert);color:#fff;border-color:var(--vert)}
.chipnav i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ocre);display:inline-block}
.chipnav i.moitie{background:linear-gradient(90deg,var(--ocre) 50%,transparent 50%)}.chipnav i.plein{background:var(--ocre)}
.chipnav.actif i{border-color:#E2C98F}.chipnav.actif i.plein{background:#E2C98F}
.progres{height:4px;background:var(--bord)}.progres i{display:block;height:100%;background:var(--ocre);transition:width .3s}
.contenu{max-width:760px;margin:0 auto;padding:16px 14px 90px}.contenu.large{max-width:900px}
.intro{color:var(--gris);margin:0 0 14px;font-size:15px}
.bloc{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:14px;margin:0 0 14px}
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 12px}
.champ{min-width:0}
.champ label{display:block;font-size:13.5px;font-weight:600;color:#33433a;margin:0 0 4px}
.champ .ligne{display:flex;align-items:center;gap:6px}
.u{font-size:12.5px;color:var(--gris);white-space:nowrap}
.aide{display:block;font-size:12px;color:var(--gris);margin-top:3px;line-height:1.35}
input[type=text],input[type=date],select,textarea{width:100%;min-height:46px;font:17px Inter;padding:8px 10px;border:1.5px solid #cfc8b4;border-radius:9px;background:#FFFDF7;color:var(--txt)}
textarea{min-height:90px;resize:vertical}.champ:has(textarea){grid-column:1/-1}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(197,139,42,.35);border-color:var(--ocre)}
.calc .val{display:block;flex:1;min-height:46px;padding:10px;background:var(--sable);border-radius:9px;font-weight:600;color:var(--vert)}
.calc.fort .val{background:var(--vert);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border:1.5px solid var(--vert);border-radius:10px;background:#fff;color:var(--vert);font:600 15px Inter;cursor:pointer}
.btn.prim{background:var(--vert);color:#fff}.btn.petit{min-height:38px;padding:0 12px;border-color:#E2C98F;background:#E2C98F;color:var(--vert)}
.btn.danger{color:#8a2d12;border-color:#d9a58f}.btn:disabled{opacity:.4}
.btn.ajout{width:100%;margin-top:10px;border-style:dashed}
.alerte{background:#FFF1D6;border:1px solid #E2C98F;border-left:4px solid var(--ocre);padding:10px 12px;border-radius:8px;margin:0 0 10px;font-size:14.5px;color:#6b4a0c}
.pasapas{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.pasapas .btn{flex:1}
.cartes{display:flex;flex-direction:column;gap:10px}
.carte{border:1px solid var(--bord);border-radius:10px;background:#FFFDF7}
.carte summary{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:11px 12px;cursor:pointer;list-style:none}
.carte summary::-webkit-details-marker{display:none}
.carte summary::before{content:'›';font-size:20px;color:var(--ocre);transition:transform .15s}
.carte[open] summary::before{transform:rotate(90deg)}
.carte .nomc{font-weight:600;color:var(--vert);flex:1 1 40%;min-width:0;overflow-wrap:anywhere}
.carte .res{font-size:12.5px;color:var(--gris);white-space:nowrap}
.carte .sup{border:0;background:none;color:#8a2d12;font:13px Inter;text-decoration:underline;cursor:pointer;padding:4px}
.carte .grille{padding:4px 12px 14px}
.tabscroll{overflow-x:auto;margin:0 -4px}
table.saisie{border-collapse:collapse;min-width:620px;width:100%}
.saisie th{font-size:12px;text-align:left;padding:5px;color:#33433a;font-weight:600;white-space:nowrap}
.saisie td{padding:3px}.saisie td input{min-height:40px;font-size:15px;padding:4px 7px}
.expc{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:14px;margin:0 0 12px}
.expc p{margin:2px 0 8px;color:var(--gris);font-size:14px}.expc small{color:var(--gris)}
.barre{height:6px;background:var(--bord);border-radius:3px;overflow:hidden;margin:6px 0}.barre i{display:block;height:100%;background:var(--ocre)}
.actions,.barre-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.barre-actions{margin:0 0 14px}
.vide{text-align:center;padding:30px 10px;color:var(--gris)}.pied{font-size:13px;color:var(--gris);margin-top:18px}
.refc{background:#fff;border:1px solid var(--bord);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.grille3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin:6px 0}.refc label{font-size:12.5px;font-weight:600;display:block}.refc input,.refc select{min-height:40px;font-size:15px}
.refc .src input{font-size:13px}
/* rapport */
.rapport{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:18px;color:var(--txt)}
.rapport h2{border-bottom:2px solid var(--ocre);padding-bottom:3px;margin:20px 0 10px;font-size:21px}
.rapport h3{font-size:15px;margin:14px 0 6px}
.bandeau{background:var(--vert);color:#fff;border-radius:10px;padding:16px 18px}.bandeau h1{color:#fff;font-size:28px}.bandeau .s{color:#E2C98F;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;margin-top:4px}
.idg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;margin:12px 0;padding:10px 12px;background:var(--creme);border-radius:8px;font-size:13.5px}
.idg b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#777;font-weight:600}
.tuiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tuile{border-top:3px solid var(--ocre);background:var(--creme);border-radius:8px;padding:8px 10px}
.tt{font-size:10.5px;text-transform:uppercase;color:#777;font-weight:600;letter-spacing:.03em}.tv{font:600 22px 'Source Serif 4',serif;color:var(--vert)}.tv small{font:11px Inter;color:#777}.td{font-size:10.5px;color:#666}
table.ind,table.eco{width:100%;border-collapse:collapse;font-size:13px}
table.ind th{background:var(--vert);color:#fff;text-align:left;padding:5px 7px;font-size:11.5px}
table.ind td,table.eco td{padding:5px 7px;border-bottom:1px solid #eee7d6;vertical-align:top}
table.eco tr.tot td{background:var(--sable);font-weight:700;color:var(--vert)}
.n{text-align:right;white-space:nowrap}.def{font-size:11px;color:#777}
.chip{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:#C6E0B4;color:var(--vert)}.chip.mid{background:#FFE699;color:#7F6000}.chip.bad{background:#F4C7A1;color:#843C0C}.chip.nd{background:#E7E3D8;color:#666}
.rapport svg{width:100%;height:auto}.leg{font-size:12px;margin:4px 0 8px}.leg span{margin-right:12px;white-space:nowrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}.note{font-size:12px;color:#666;margin:6px 0}
.com{border-left:3px solid var(--ocre);background:var(--creme);padding:6px 12px 8px;margin:0 0 8px}.com p{margin:0;font-size:14px}
.sources{margin-top:12px;font-size:12px;color:#555}.sources ul{padding-left:18px;margin:4px 0}
@media(max-width:600px){.grille{grid-template-columns:1fr}.idg{grid-template-columns:1fr 1fr}.tuiles{grid-template-columns:1fr 1fr}.duo{grid-template-columns:1fr}.grille3{grid-template-columns:1fr}.rapport{padding:12px;overflow-x:auto}table.ind{min-width:520px}.modnav{top:53px}}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .noprint,.haut,.modnav,.progres{display:none!important}
 .contenu{max-width:none;padding:0}.rapport{border:0;padding:0}
 .saut{break-before:page}.rapport h2,.rapport h3{break-after:avoid}tr,svg,.com{break-inside:avoid}.def{display:none}.rapport h2{margin-top:14px}
 .tuiles{grid-template-columns:repeat(4,1fr)}.duo{grid-template-columns:1fr 1fr}.idg{grid-template-columns:repeat(3,1fr)}
}

/* ---------- Fonctions de calcul sur les rations ---------- */
function ligneFourrage(g,nom){ return nom? g.rows('fourrages').find(x=>x.nom===nom):null; }
function ligneConc(g,nom){ return nom? g.rows('concentres').find(x=>x.nom===nom):null; }
function pdiFourrage(f){ const a=num(f.pdie), b=num(f.pdin); if(a&&b) return Math.min(a,b); return a||b||0; }
function msRation(r,g){
  let t=num(r.f1kg)+num(r.f2kg)+num(r.patkg);
  [['c1','c1kg'],['c2','c2kg']].forEach(([c,q])=>{ const l=ligneConc(g,r[c]); if(l&&num(r[q])) t+=num(r[q])*pm(l.ms)/100; });
  return t||null;
}
function concMs(r,g){
  let t=0; [['c1','c1kg'],['c2','c2kg']].forEach(([c,q])=>{ const l=ligneConc(g,r[c]); if(l&&num(r[q])) t+=num(r[q])*pm(l.ms)/100; });
  return t||null;
}
function aptRation(r,g,w){
  let t=0, any=false;
  [['f1','f1kg'],['f2','f2kg']].forEach(([f,q])=>{ const l=ligneFourrage(g,r[f]); if(l&&num(r[q])){ const v= w==='ufl'?num(l.ufl):pdiFourrage(l); t+=num(r[q])*v; any=true; } });
  if(num(r.patkg)){ t+=num(r.patkg)*(w==='ufl'?num(r.patufl):num(r.patpdi)); any=true; }
  [['c1','c1kg'],['c2','c2kg']].forEach(([c,q])=>{ const l=ligneConc(g,r[c]); if(l&&num(r[q])){ const kgms=num(r[q])*pm(l.ms)/100; t+=kgms*(w==='ufl'?num(l.ufl):num(l.pdi)); any=true; } });
  return any? t:null;
}
// Une teneur en matière sèche absente vaut 0, sauf pour les concentrés où la valeur usuelle (88 %) est préremplie.
function pm(v){ return (v===''||v==null)? 0 : num(v); }

  C('autonomie_alim','Autonomie alimentaire (matière sèche)','%','pct',g=> { const nb=g.n('brebis_presentes'); if(!nb||!g.n('ms_totale')) return null;
      const prod=(g.z('ms_produit')+g.z('stock_debut')-g.z('stock_fin'))*1000/nb+g.z('herbe_pat')+g.sum('concentres','ms_kg',r=>r.origine==='Produit sur l\'exploitation'&&!['Minéral et vitamines','Lait maternisé'].includes(r.cat))/nb; return prod/g.n('ms_totale'); },{aide:'Matière sèche produite sur l\'exploitation (fourrages, herbe, concentrés produits) ÷ matière sèche totale consommée'}),

function ratFourrageT(g){ let t=0, any=false; g.rows('rations').forEach(r=>{ const s=num(r.f1kg)+num(r.f2kg); if(s&&num(r.eff)&&num(r.jours)){ t+=s*num(r.eff)*num(r.jours)/1000; any=true; } }); return any?t:null; }
function moyPond(g,t,c){ let s=0,w=0; g.rows(t).forEach(r=>{ const l=num(r.litres), v=num(r[c]); if(l&&v){ s+=l*v; w+=l; } }); return w? s/w:null; }
function moyPondMS(g,c){ let s=0,w=0; g.rows('fourrages').forEach(r=>{ if(r.type==='Paille (litière)') return; const q=num(r.qte)*pm(r.ms)/100, v=num(r[c]); if(q&&v){ s+=q*v; w+=q; } }); return w? s/w:null; }

const STORE_KEY = 'bilans-ovins-ordiarp-v1';
const num = v => { if(v===''||v==null) return 0; if(typeof v==='number') return isFinite(v)?v:0; const x=parseFloat(String(v).replace(/[\s  ]/g,'').replace(',','.')); return isFinite(x)?x:0; };
const dv = (a,b) => (a==null||!isFinite(a)||b==null||!b||!isFinite(b)) ? null : a/b;
const jours = (a,b) => { if(!a||!b) return null; const x=Math.round((new Date(b)-new Date(a))/864e5); return isFinite(x)&&x>=0?x:null; };
const _nf = d => new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const FM = { int:v=>_nf(0).format(v), d1:v=>_nf(1).format(v), d2:v=>_nf(2).format(v), pct:v=>_nf(1).format(v*100)+' %', eur:v=>_nf(0).format(v)+' €', eur2:v=>_nf(2).format(v)+' €' };
const fmtVal = (v,f) => (v==null||typeof v!=='number'||!isFinite(v)) ? '—' : (FM[f]||FM.d2)(v);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Index des champs et des calculs */
const ALLC = {}, FIELDS = {};
MODULES.forEach(m=>m.blocs.forEach(b=>(b.f||[]).forEach(f=>{ FIELDS[f.k]=f; if(f.t==='c') ALLC[f.k]=f; })));

function sauver(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(DB)); stockageOk=true; }catch(e){ stockageOk=false; } majEtat(); }

/* ---------------- Moteur de calcul ---------------- */
function rowsOf(exp,t){ const def=TABLES[t]; let r=exp.t[t]; if(!r) r=exp.t[t]=[]; if(def.fixe){ while(r.length<def.fixe.length) r.push({}); } return r; }
function makeG(exp){
  const memo={}, busy={}, rcCache=new WeakMap();
  const g = {
    n(k){ if(ALLC[k]){ if(k in memo) return memo[k]; if(busy[k]) return null; busy[k]=1; let v=null; try{ v=ALLC[k].f(g); }catch(e){ v=null; } busy[k]=0; if(typeof v!=='number'||!isFinite(v)) v=null; return memo[k]=v; }
          const r=exp.f[k]; return (r===''||r==null)?null:num(r); },
    z(k){ const v=g.n(k); return v==null?0:v; },
    d(k){ return exp.f[k]||null; },
    rows(t){ return rowsOf(exp,t); },
    rc(t,row){ if(rcCache.has(row)) return rcCache.get(row); const o={}; (TABLES[t].rcalcs||[]).forEach(c=>{ let v=null; try{ v=c.f(row,g,o); }catch(e){} o[c.k]=(typeof v==='number'&&isFinite(v))?v:null; }); rcCache.set(row,o); return o; },
    sum(t,col,pred){ const def=TABLES[t]; const isC=(def.rcalcs||[]).some(c=>c.k===col); let s=0, any=false;
      rowsOf(exp,t).forEach(row=>{ if(pred&&!pred(row)) return; let v; if(isC){ v=g.rc(t,row)[col]; if(v==null) return; } else { if(row[col]===''||row[col]==null) return; v=num(row[col]); } s+=v; any=true; });
      return any? s : null; }
  };
  return g;
}

/* ---------------- Références et appréciation ---------------- */
function refOf(ind){ const u=DB.refs[ind.k]||{}; return { ref: u.ref!==undefined? u.ref : (ind.ref!==undefined?ind.ref:''), sens: u.sens||ind.sens, tol: u.tol!==undefined? u.tol : ind.tol, src: u.src!==undefined? u.src : (ind.src||'') }; }
function apprec(ind,val){
  const r=refOf(ind); const ref=num(r.ref);
  if(r.sens==='I') return 'Pour information';
  if(!ref) return 'Pas de référence';
  if(val==null||val===0) return 'Non renseigné';
  const e=(r.sens==='H'?1:-1)*(val-ref)/ref;
  return e>num(r.tol)?'Favorable':(e<-num(r.tol)?'À améliorer':'Proche de la référence');
}
const CLS = {'Favorable':'ok','Proche de la référence':'mid','À améliorer':'bad'};
const chip = a => `<span class="chip ${CLS[a]||'nd'}">${esc(a)}</span>`;
function ecartTxt(ind,val){ const r=refOf(ind), ref=num(r.ref); if(!ref||val==null||val===0) return '—'; const e=(val-ref)/ref*100; return (e>=0?'+':'−')+Math.abs(e).toFixed(0)+' %'; }

/* ---------------- Complétude ---------------- */
function compMod(exp,m){
  let tot=0, ok=0;
  m.blocs.forEach(b=>{ if(b.table){ tot++; const rows=exp.t[b.table]||[]; if(rows.some(r=>Object.values(r).some(v=>v!==''&&v!=null))) ok++; }
    (b.f||[]).forEach(f=>{ if(f.t==='c'||f.def!=null) return; tot++; const v=exp.f[f.k]; if(v!==''&&v!=null) ok++; }); });
  return tot? ok/tot : 0;
}
const compTotale = exp => { const ms=MODULES; return ms.reduce((s,m)=>s+compMod(exp,m),0)/ms.length; };

/* ---------------- Composants HTML ---------------- */
function optionsDyn(g,dyn){
  const t = dyn; const noms=[...new Set(g.rows(t).map(r=>r.nom).filter(Boolean))]; return noms;
}
function champHTML(f,val,attrs,g){
  const aide = f.aide? `<small class="aide">${esc(f.aide)}</small>`:'';
  const unit = f.u? `<span class="u">${esc(f.u)}</span>`:'';
  if(f.t==='c') return `<div class="champ calc${f.fort?' fort':''}"><label>${esc(f.l)}</label><div class="ligne"><span class="val" data-calc="${f.k}">—</span>${unit}</div>${aide}</div>`;
  let inp='';
  if(f.t==='s'){ let opts=f.opts; if(f.dyn) opts=optionsDyn(g,f.dyn);
    inp=`<select ${attrs}><option value="">Choisir…</option>${opts.map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('')}${val&&!opts.includes(val)?`<option selected>${esc(val)}</option>`:''}</select>`; }
  else if(f.t==='d') inp=`<input type="date" ${attrs} value="${esc(val)}">`;
  else if(f.t==='a') inp=`<textarea rows="3" ${attrs}>${esc(val)}</textarea>`;
  else if(f.t==='t') inp=`<input type="text" ${attrs} value="${esc(val)}" autocomplete="off">`;
  else inp=`<input type="text" inputmode="decimal" ${attrs} value="${esc(val)}" autocomplete="off">`;
  return `<div class="champ"><label>${esc(f.l)}</label><div class="ligne">${inp}${unit}</div>${aide}</div>`;
}
function tableHTML(t,exp,g){
  const def=TABLES[t]; const rows=rowsOf(exp,t);
  if(def.fixe){
    return `<section class="bloc"><h3>${esc(def.titre)}</h3><div class="tabscroll"><table class="saisie"><thead><tr><th>Mois</th>${def.cols.map(c=>`<th>${esc(c.l)}<br><span class="u">${esc(c.u||'')}</span></th>`).join('')}</tr></thead><tbody>${
      def.fixe.map((m,i)=>`<tr><th>${m}</th>${def.cols.map(c=>`<td><input type="text" inputmode="decimal" data-t="${t}" data-i="${i}" data-c="${c.k}" value="${esc(rows[i][c.k])}" autocomplete="off"></td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  }
  return `<section class="bloc" data-table="${t}"><h3>${esc(def.titre)}</h3><div class="cartes">${rows.map((r,i)=>carteHTML(t,r,i,g,i===rows.length-1&&exp._ouvert===t)).join('')}</div><button class="btn ajout" data-add="${t}">+ ${esc(def.ajout)}</button></section>`;
}
function carteHTML(t,r,i,g,ouvert){
  const def=TABLES[t];
  const champs=def.cols.map(c=>champHTML(c,r[c.k]==null?'':r[c.k],`data-t="${t}" data-i="${i}" data-c="${c.k}"`,g)).join('');
  const calcs=(def.rcalcs||[]).map(c=>`<div class="champ calc"><label>${esc(c.l)}</label><div class="ligne"><span class="val" data-rc="${t}|${i}|${c.k}" data-fmt="${c.fmt}">—</span><span class="u">${esc(c.u||'')}</span></div></div>`).join('');
  return `<details class="carte"${ouvert?' open':''}><summary><span class="nomc" data-nom="${t}|${i}">${esc(def.libelle(r,i))}</span><span class="res" data-resume="${t}|${i}"></span><button class="sup" data-del="${t}|${i}" aria-label="Supprimer">Supprimer</button></summary><div class="grille">${champs}${calcs}</div></details>`;
}
function moduleHTML(m,exp,g){
  let h=`<h2>${esc(m.t)}</h2><p class="intro">${esc(m.intro||'')}</p><div id="alertes"></div>`;
  m.blocs.forEach(b=>{
    if(b.table){ h+=tableHTML(b.table,exp,g); return; }
    h+=`<section class="bloc">${b.t?`<h3>${esc(b.t)}</h3>`:''}${b.intro?`<p class="intro">${esc(b.intro)}</p>`:''}<div class="grille">${b.f.map(f=>champHTML(f,exp.f[f.k]==null?'':exp.f[f.k],`data-k="${f.k}"`,g)).join('')}</div></section>`;
  });
  return h;
}

function svgPile(segs,suffixe){
  const tot=segs.reduce((s,x)=>s+Math.max(x.v,0),0); if(!tot) return '<p class="note">Données insuffisantes.</p>';
  let x=0, s=`<svg viewBox="0 0 640 34" role="img">`; segs.forEach(sg=>{ const w=640*Math.max(sg.v,0)/tot; if(w>0){ s+=`<rect x="${x.toFixed(1)}" y="2" width="${w.toFixed(1)}" height="28" fill="${sg.c}"/>`; if(w>46) s+=`<text x="${(x+w/2).toFixed(1)}" y="21" text-anchor="middle" font-size="12" fill="${sg.t||'#fff'}">${Math.round(sg.v/tot*100)} %</text>`; } x+=w; });
  s+='</svg><div class="leg">'+segs.filter(z=>z.v>0).map(z=>`<span><i style="background:${z.c}"></i>${esc(z.l)} : ${FM.int(z.v)}${suffixe}</span>`).join('')+'</div>';
  return s;
}

/* ---------------- Export et import ---------------- */
function telecharger(nom,contenu,type){ const b=new Blob([contenu],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nom; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
const slug = s => String(s||'bilan').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()||'bilan';
function exporterJSON(exps,nom){ telecharger(nom,JSON.stringify({version:1,export:new Date().toISOString(),exps,refs:DB.refs},null,1),'application/json'); }
function exporterCSV(exp){ const g=makeG(exp); const l=[['Volet','Indicateur','Unité','Valeur','Référence','Appréciation']];
  INDICATEURS.forEach(i=>{ const v=g.n(i.k); l.push([i.v,i.l,i.u,v==null?'':String(v).replace('.',','),num(refOf(i).ref)?String(refOf(i).ref).replace('.',','):'',apprec(i,v)]); });
  telecharger(`indicateurs-${slug(nomExp(exp))}-${slug(exp.f.campagne)}.csv`,'﻿'+l.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n'),'text/csv;charset=utf-8'); }
function importer(file){ const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d||!Array.isArray(d.exps)) throw new Error('format'); let n=0; d.exps.forEach(e=>{ if(!e||!e.f) return; const i=DB.exps.findIndex(x=>x.id===e.id); if(i>=0) DB.exps[i]=e; else DB.exps.push(e); n++; }); if(d.refs&&Object.keys(d.refs).length) DB.refs=Object.assign({},DB.refs,d.refs); sauver(); render(); alert(`${n} dossier(s) importé(s).`); }catch(err){ alert('Ce fichier n\'est pas un export valide de cette application.'); } }; fr.readAsText(file); }

/* ---------- Exécution ---------- */
function diagnostiquer(exp){
  const g=makeG(exp); const res=[], nonEval=[];
  REGLES.forEach(r=>{
    const manque=(r.donnees||[]).filter(k=>!dispo(g,k));
    if(manque.length){ nonEval.push({titre:r.titre,manque:manque.map(libDonnee)}); return; }
    let o=null; try{ o=r.test(g); }catch(e){ o=null; }
    if(o) res.push({id:r.id,titre:r.titre,...o});
  });
  /* Indicateurs en retrait par rapport aux références du centre */
  INDICATEURS.forEach(i=>{
    const v=g.n(i.k); if(apprec(i,v)!=='À améliorer') return; const r=refOf(i); const e=(i.sens==='H'?1:-1)*(v-num(r.ref))/num(r.ref);
    res.push({ id:'ref_'+i.k, titre:`${i.l} en retrait de la référence`, grav:e<-0.25?3:2,
      faits:[`${i.l} : ${fmtVal(v,i.fmt)} ${i.u}, contre ${fmtVal(num(r.ref),i.fmt)} pour la référence (${ecartTxt(i,v)}).`, r.src?`Référence : ${r.src}`:'Référence saisie par le centre.'],
      pistes:PISTES_IND[i.k]||[ P('Chercher la cause dans les indicateurs qui composent celui-ci.','terrain') ] });
  });
  res.sort((a,b)=>b.grav-a.grav);
  return {res,nonEval};
}
function diagHTML(exp){
  const {res,nonEval}=diagnostiquer(exp); const nb=n=>res.filter(x=>x.grav===n).length; const utilisees=new Set();
  res.forEach(x=>x.pistes.forEach(p=>{ if(p.s) utilisees.add(p.s); }));
  const sommaire=res.length?`<p class="note"><b>${res.length}</b> point(s) relevé(s) : ${nb(3)} à traiter en priorité, ${nb(2)} à surveiller, ${nb(1)} à vérifier ou à noter.</p>`:'<p class="note">Aucun problème détecté avec les données saisies. Cela peut venir de données manquantes : voir plus bas.</p>';
  const cartes=res.map(x=>`<article class="diag g${x.grav}"><div class="gr">${GRAV[x.grav]}</div><h3>${esc(x.titre)}</h3><p class="lab">Ce que disent les données</p><ul>${x.faits.map(f=>`<li>${esc(f)}</li>`).join('')}</ul><p class="lab">Pistes de solution</p><ul class="pistes">${x.pistes.map(p=>`<li><span class="pv ${p.p}">${p.p==='src'?'Source citée':'Repère de terrain'}</span> ${esc(p.t)}</li>`).join('')}</ul></article>`).join('');
  const srcs=[...utilisees].map(k=>SOURCES[k]).filter(Boolean).map(s=>`<li><b>${esc(s.t)}</b> : ${esc(s.r)} <span class="url">${esc(s.u)}</span></li>`).join('');
  const ne=nonEval.length?`<div class="noneval"><h4>Contrôles non réalisés faute de données</h4><ul>${nonEval.map(x=>`<li><b>${esc(x.titre)}</b> : il manque ${esc(x.manque.join(', '))}.</li>`).join('')}</ul></div>`:'';
  return `${sommaire}<p class="note"><span class="pv src">Source citée</span> : la piste s'appuie sur une publication consultée (listée en fin de section). <span class="pv terrain">Repère de terrain</span> : pratique courante, non démontrée ici, à valider par le centre. Les écarts à une référence ne se calculent que si le centre a saisi cette référence.</p>${cartes}${ne}${srcs?`<div class="sources"><h4>Sources des pistes</h4><ul>${srcs}</ul></div>`:''}`;
}


/* ============================================================
   RAPPORT — graphiques et mise en page du bilan
   Chaque graphique dit ce qu'il lui manque quand les données
   ne suffisent pas.

const COL = { v:'#1F3D2B', v2:'#2F5A40', v3:'#5B7F5E', o:'#C58B2A', sable:'#E2C98F', br:'#9A6B1C', gris:'#9A9A8A', bad:'#843C0C', bon:'#2F5A40' };
const gr  = s => `<div class="graph">${s}</div>`;
const msg = t => `<p class="note manque">${t}</p>`;
const tx  = (x,y,t,o='') => `<text x="${(+x).toFixed(1)}" y="${(+y).toFixed(1)}" ${o}>${esc(t)}</text>`;
const court = (t,n) => { t=String(t||''); return t.length>n? t.slice(0,n-1)+'…':t; };

/* 1. Lait mois par mois, avec matière grasse et protéique */
function svgCourbes(exp){
  const rows=rowsOf(exp,'lait_mensuel'); const L=rows.map(r=>num(r.litres));
  if(!L.some(x=>x>0)) return msg('Courbe de lactation : saisissez le lait livré mois par mois (rubrique Lait).');
  const W=640,H=170,y0=18,x0=46,x1=590,bw=(x1-x0)/12,mx=Math.max(...L,1);
  const tb=rows.map(r=>num(r.tb)), tp=rows.map(r=>num(r.tp)); const sm=Math.max(...tb,...tp,1)*1.15;
  const yL=v=>y0+H*(1-v/mx), yG=v=>y0+H*(1-v/sm);
  let s=`<svg viewBox="0 0 ${W} ${H+62}" role="img" aria-label="Lait livré par mois, matière grasse et protéique">`;
  [0,.5,1].forEach(t=>{ const y=y0+H*(1-t); s+=`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="#e5dfcd"/>`+tx(x0-6,y+4,FM.int(mx*t),'text-anchor="end" font-size="11" fill="#666"')+tx(x1+6,y+4,FM.int(sm*t),'font-size="11" fill="#9A6B1C"'); });
  L.forEach((v,i)=>{ if(v>0){ s+=`<rect x="${(x0+i*bw+7).toFixed(1)}" y="${yL(v).toFixed(1)}" width="${(bw-14).toFixed(1)}" height="${(y0+H-yL(v)).toFixed(1)}" rx="2" fill="${COL.v}" opacity=".9"/>`; }
    s+=tx(x0+i*bw+bw/2,y0+H+16,MOIS[i].slice(0,3)+'.','text-anchor="middle" font-size="11" fill="#555"'); });
  const ligne=(a,c)=>{ const pts=a.map((v,i)=>v>0?[x0+i*bw+bw/2,yG(v)]:null).filter(Boolean); if(pts.length<2) return ''; return `<polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2.2"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${c}"/>`).join(''); };
  s+=ligne(tb,COL.o)+ligne(tp,COL.bad);
  s+=`<rect x="${x0}" y="${H+36}" width="10" height="10" fill="${COL.v}"/>`+tx(x0+15,H+45,'Litres livrés (axe de gauche)','font-size="11" fill="#333"')+`<line x1="${x0+210}" x2="${x0+226}" y1="${H+41}" y2="${H+41}" stroke="${COL.o}" stroke-width="2.5"/>`+tx(x0+231,H+45,'Matière grasse g/L','font-size="11" fill="#333"')+`<line x1="${x0+350}" x2="${x0+366}" y1="${H+41}" y2="${H+41}" stroke="${COL.bad}" stroke-width="2.5"/>`+tx(x0+371,H+45,'Matière protéique g/L (axe de droite)','font-size="11" fill="#333"');
  return gr(s+'</svg>');
}
function svgCellules(exp){
  const rows=rowsOf(exp,'lait_mensuel'); const C=rows.map(r=>num(r.cell)); if(!C.some(x=>x>0)) return msg('Cellules : saisissez les cellules mois par mois (rubrique Lait) pour voir leur évolution.');
  const W=640,H=70,x0=46,x1=590,bw=(x1-x0)/12,mx=Math.max(...C,1); let s=`<svg viewBox="0 0 ${W} ${H+48}" role="img" aria-label="Cellules par mois"><g transform="translate(0,14)">`;
  C.forEach((v,i)=>{ if(v>0){ const h=Math.max(2,v/mx*H); s+=`<rect x="${(x0+i*bw+7).toFixed(1)}" y="${(H+8-h).toFixed(1)}" width="${(bw-14).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${COL.br}"/>`+tx(x0+i*bw+bw/2,H+4-h,FM.int(v),'text-anchor="middle" font-size="10" fill="#333"'); } s+=tx(x0+i*bw+bw/2,H+24,MOIS[i].slice(0,3)+'.','text-anchor="middle" font-size="11" fill="#555"'); });
  return gr(s+'</g></svg>')+'<p class="note">Cellules en milliers par millilitre.</p>';
}

/* 3. Couverture des besoins par lot */
function svgCouverture(g){
  const lots=g.rows('rations').filter(r=>r.nom||r.stade).map(r=>({n:r.nom||r.stade,c:g.rc('rations',r)})).filter(x=>x.c.cov_ufl!=null||x.c.cov_pdi!=null);
  if(!lots.length) return msg('Couverture des besoins : saisissez au moins un lot avec ses fourrages, ses concentrés et ses besoins (rubrique Rations).');
  const W=640,lab=170,max=1.5,bh=15,gap=12,top=18,Hh=lots.length*(2*bh+gap)+top+22; const xs=v=>lab+(W-lab-30)*Math.min(v,max)/max;
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Couverture des besoins par lot">`;
  s+=`<rect x="${xs(.95)}" y="${top-4}" width="${xs(1.15)-xs(.95)}" height="${Hh-top-12}" fill="#E8EFE3"/><line x1="${xs(1)}" x2="${xs(1)}" y1="${top-4}" y2="${Hh-16}" stroke="${COL.v}" stroke-dasharray="4 3"/>`;
  [0,.5,1,1.5].forEach(t=>{ s+=tx(xs(t),Hh-3,Math.round(t*100)+' %','text-anchor="middle" font-size="11" fill="#666"'); });
  lots.forEach((l,i)=>{ const y=top+i*(2*bh+gap); s+=tx(lab-8,y+bh+4,court(l.n,24),'text-anchor="end" font-size="12" fill="#333"');
    [['cov_ufl','Énergie',COL.v],['cov_pdi','Protéines',COL.o]].forEach(([k,lib,c],j)=>{ const v=l.c[k]; const yy=y+j*bh; if(v==null){ s+=tx(lab+4,yy+bh-3,lib+' : non calculable','font-size="10" fill="#888"'); return; }
      const col=v<.95?COL.bad:(v>1.15?COL.br:c); s+=`<rect x="${lab}" y="${yy+1}" width="${(xs(v)-lab).toFixed(1)}" height="${bh-3}" fill="${col}"/>`+tx(xs(v)+5,yy+bh-3,`${lib} ${Math.round(v*100)} %`,'font-size="11" fill="#222"'); }); });
  return gr(s+'</svg>')+'<p class="note">Zone claire : couverture entre 95 et 115 % (repère indicatif). Barre brune : apport insuffisant ou excessif.</p>';
}

/* 4. Cascade économique */
function svgCascade(g){
  if(g.n('produit_total')==null) return msg('Cascade économique : saisissez les produits et les charges (rubrique Économie).');
  const autres=g.z('charges_oper')-g.z('ch_alim');
  const st=[['Lait',g.z('produit_lait')+g.z('produit_fermier'),'+'],['Agneaux',g.z('ventes_agn'),'+'],['Autres',g.z('ventes_reformes')+g.z('laine')+g.z('autres_produits'),'+'],['Aides',g.z('aides_total'),'+'],['Alimentation',-g.z('ch_alim'),'-'],['Autres troupeau',-autres,'-'],['Structure',-g.z('charges_structure'),'-'],['EBE',null,'='],['Amort. et frais',-(g.z('amortissements')+g.z('frais_financiers')),'-'],['Résultat courant',null,'=']];
  let run=0; const bars=st.map(([l,v,t])=>{ if(t==='='){ const b={l,a:0,b:run,t}; return b; } const a=run; run+=v; return {l,a,b:run,t}; });
  const all=bars.flatMap(b=>[b.a,b.b]); const mx=Math.max(...all,0), mn=Math.min(...all,0); const W=640,H=190,y0=14,xl=10,bw=(W-xl*2)/bars.length; const y=v=>y0+H*(mx-v)/((mx-mn)||1);
  let s=`<svg viewBox="0 0 ${W} ${H+56}" role="img" aria-label="Du produit au résultat">`;
  s+=`<line x1="${xl}" x2="${W-xl}" y1="${y(0)}" y2="${y(0)}" stroke="#999"/>`;
  bars.forEach((b,i)=>{ const x=xl+i*bw+6, top=Math.min(y(b.a),y(b.b)), h=Math.max(2,Math.abs(y(b.a)-y(b.b))); const col=b.t==='='?COL.v:(b.t==='+'?COL.v3:COL.o); const val=b.t==='='?b.b:b.b-b.a;
    s+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${(bw-12).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${col}"/>`+tx(x+(bw-12)/2,top-4,FM.int(val),'text-anchor="middle" font-size="10.5" font-weight="600" fill="#222"')+tx(x+(bw-12)/2,H+y0+16,court(b.l,12),'text-anchor="middle" font-size="10.5" fill="#444"'); });
  return gr(s+'</svg>')+'<p class="note">En euros. Vert : produits. Ocre : charges. Vert foncé : soldes (EBE puis résultat courant).</p>';
}

/* 5. Écarts aux références du centre */
function svgEcarts(g){
  const L=INDICATEURS.map(i=>{ const v=g.n(i.k), r=num(refOf(i).ref); if(v==null||v===0||!r) return null; return {i,e:(v-r)/r,v}; }).filter(Boolean);
  if(!L.length) return msg('Profil par rapport aux références : aucune référence saisie. Renseignez-les dans « Références » depuis la liste des dossiers.');
  const W=640,lab=210,bh=24,cx=lab+(W-lab-70)/2,half=(W-lab-70)/2; let s=`<svg viewBox="0 0 ${W} ${L.length*bh+22}" role="img" aria-label="Écarts aux références">`;
  s+=`<line x1="${cx}" x2="${cx}" y1="0" y2="${L.length*bh+4}" stroke="#777"/>`;
  L.forEach((x,i)=>{ const y=i*bh+2, sens=refOf(x.i).sens, c=Math.max(-1,Math.min(1,x.e)), w=Math.abs(c)*half;
    const bon= sens==='I'? null : (sens==='H'? x.e>0 : x.e<0); const col= bon==null?COL.gris:(bon?COL.bon:COL.bad);
    s+=tx(lab-8,y+16,court(x.i.l,34),'text-anchor="end" font-size="11.5" fill="#333"')+`<rect x="${(c<0?cx-w:cx).toFixed(1)}" y="${y+3}" width="${Math.max(w,1.5).toFixed(1)}" height="${bh-9}" fill="${col}"/>`+tx(cx+half+8,y+16,(x.e>=0?'+':'−')+Math.abs(Math.round(x.e*100))+' %','font-size="11.5" font-weight="600" fill="#222"'); });
  return gr(s+'</svg>')+'<p class="note">Vert : meilleur que la référence. Brun : moins bon. Gris : indicateur donné pour information. Les écarts supérieurs à 100 % sont tronqués.</p>';
}

/* 6. Calendrier de la campagne */
function svgCalendrier(g){
  const ev=[['Lutte','lutte_debut','lutte_fin',COL.o],['Mises bas','agnelage_debut','agnelage_fin',COL.v],['Traite','traite_debut','traite_fin',COL.v3],['Estive','estive_debut','estive_fin',COL.br]]
    .map(([l,a,b,c])=>({l,a:g.d(a)&&new Date(g.d(a)+'T00:00:00'),b:g.d(b)&&new Date(g.d(b)+'T00:00:00'),c})).filter(e=>e.a&&e.b&&e.b>=e.a);
  if(!ev.length) return msg('Calendrier : saisissez les dates de lutte, de mises bas, de traite ou d\'estive.');
  const d0=new Date(Math.min(...ev.map(e=>e.a))); d0.setDate(1); const d1=new Date(Math.max(...ev.map(e=>e.b))); d1.setMonth(d1.getMonth()+1,1);
  const nm=(d1.getFullYear()-d0.getFullYear())*12+d1.getMonth()-d0.getMonth(); const W=640,lab=80,pw=W-lab-10,bh=26,H=ev.length*bh+30; const xs=d=>lab+pw*(d-d0)/(d1-d0);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calendrier de la campagne">`;
  for(let i=0;i<nm;i++){ const m=new Date(d0.getFullYear(),d0.getMonth()+i,1); const x=xs(m); s+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="0" y2="${ev.length*bh+4}" stroke="#e5dfcd"/>`+tx(x+pw/nm/2,H-8,m.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''),'text-anchor="middle" font-size="10.5" fill="#555"'); }
  ev.forEach((e,i)=>{ const y=i*bh+3, x=xs(e.a), w=Math.max(4,xs(new Date(+e.b+864e5))-x); s+=tx(lab-8,y+17,e.l,'text-anchor="end" font-size="12" fill="#333"')+`<rect x="${x.toFixed(1)}" y="${y+2}" width="${w.toFixed(1)}" height="${bh-8}" rx="3" fill="${e.c}"/>`; });
  return gr(s+'</svg>');
}

/* 7. Qualité des fourrages analysés */
function svgFourrages(g){

  if(!P.length) return msg('Qualité des fourrages : saisissez au moins une analyse (énergie et azote) dans la rubrique Fourrages.');
  const xs=P.map(r=>num(r.mat)), ys=P.map(r=>num(r.ufl)); const xmin=Math.min(...xs,100)-15, xmax=Math.max(...xs,160)+15, ymin=Math.min(...ys,.55)-.05, ymax=Math.max(...ys,.8)+.05;
  const W=640,H=222,x0=52,y0=24,pw=W-x0-20,ph=H-y0-34; const X=v=>x0+pw*(v-xmin)/(xmax-xmin), Y=v=>y0+ph*(1-(v-ymin)/(ymax-ymin));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Énergie et azote des fourrages">`;
  [0,.5,1].forEach(t=>{ const v=ymin+(ymax-ymin)*t; s+=`<line x1="${x0}" x2="${W-20}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e5dfcd"/>`+tx(x0-6,Y(v)+4,FM.d2(v),'text-anchor="end" font-size="11" fill="#666"'); const a=xmin+(xmax-xmin)*t; s+=tx(X(a),H-18,FM.int(a),'text-anchor="middle" font-size="11" fill="#666"'); });
  s+=tx(x0+pw/2,H-3,'Matière azotée totale (g/kg MS)','text-anchor="middle" font-size="11" fill="#444"')+tx(x0,y0-2,'UFL/kg MS','font-size="11" fill="#444"');
  P.forEach(r=>{ const x=X(num(r.mat)), y=Y(num(r.ufl)), ach=r.origine==='Acheté'; s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="${ach?COL.o:COL.v}"/>`+tx(x+9,y+4,court(r.nom||r.type,22),'font-size="11" fill="#222"'); });
  return gr(s+'</svg>')+'<p class="note">Vert : produit sur l\'exploitation. Ocre : acheté. Les fourrages sans analyse ne figurent pas.</p>';
}

  it.forEach((x,i)=>{ const y=i*bh+2, w=Math.abs(x[1])/mx*half; s+=tx(lab-8,y+17,x[0],'text-anchor="end" font-size="11.5" fill="#333"')+`<rect x="${(x[1]<0?cx-w:cx).toFixed(1)}" y="${y+3}" width="${Math.max(w,1.5).toFixed(1)}" height="${bh-9}" fill="${x[1]<0?COL.bad:COL.bon}"/>`+tx(cx+half+8,y+17,`${x[1]>=0?'+':'−'}${FM.int(Math.abs(x[1]))} €`+(ebe?` (${x[1]>=0?'+':'−'}${Math.abs(Math.round(x[1]/ebe*100))} %)`:''),'font-size="11.5" font-weight="600" fill="#222"'); });
